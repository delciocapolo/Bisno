name: "bisno"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: bisno_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - bisno_network

  app:
    build:
      context: ..
      target: production
    profiles: ["app"]
    container_name: bisno_app
    restart: unless-stopped
    env_file:
      - ../.env
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${APP_PORT}/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      evolution-api:
        condition: service_healthy
    networks:
      - bisno_network

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: bisno_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bisno_network

  redis:
    image: redis:7-alpine
    container_name: bisno_redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command:
      ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data
    networks:
      - bisno_network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: bisno_amqp
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBIT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBIT_PASSWORD}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bisno_network

  evolution-api:
    build:
      context: ./evolution
      dockerfile: Dockerfile
    container_name: bisno_evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - bisno_network
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "${SERVER_URL}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  bisno_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
  rabbitmq_data:
  evolution_instances:
